# GitLab CI/CD 流水线
# 流程：MR 合并到 main 后自动触发，依次执行 测试 → 构建 → 打 tag 并发布到 GitLab Package Registry
# 发布认证使用 CI_JOB_TOKEN（GitLab 内置，无需手动生成 token）

stages:
  - test
  - build
  - release
  - deploy

default:
  image: node:22
  before_script:
    # corepack 会根据根 package.json 的 packageManager 字段自动使用 pnpm 11.24.0
    - corepack enable
    - corepack prepare --activate

cache:
  key: pnpm-store
  paths:
    - .pnpm-store/

test:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
  rules:
    # MR 与 main 分支都执行测试，保证合并前验证
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'

build:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - packages/utils/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'

release:
  stage: release
  needs: [build]
  script:
    - pnpm install --frozen-lockfile
    # 1. 读取版本号
    - |
      PACKAGE_VERSION=$(node -p "require('./packages/utils/package.json').version")
      TAG="v${PACKAGE_VERSION}"
      echo "release tag: ${TAG}"
    # 2. 远程 tag 已存在则跳过，避免同一版本重复发布
    - |
      if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
        echo "tag ${TAG} already exists, skip release"
        exit 0
      fi
    # 3. 打 tag 并推送（使用 CI_JOB_TOKEN 认证）
    - |
      git config user.name "GitLab CI"
      git config user.email "ci@gitlab.com"
      git tag ${TAG}
      git push "http://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" --tags
    # 4. 动态写入发布认证信息，不提交任何敏感配置
    - |
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" > .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:always-auth=true" >> .npmrc
    # 5. 发布（prepublishOnly 会自动构建；--no-git-checks 跳过 CI 中的 git 状态检查）
    - |
      pnpm --filter @core/utils publish --no-git-checks \
        --registry "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
  environment:
    name: production

# GitLab Pages 部署：将 VitePress 构建产物放入 public/ 目录即可发布
pages:
  stage: deploy
  script:
    - pnpm install --frozen-lockfile
    - pnpm docs:build
    - cp -r docs/.vitepress/dist public
  artifacts:
    paths:
      - public/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
