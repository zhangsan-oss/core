image:
  name: node:24-alpine


stages:
  - docs


docs-build:

  stage: docs

  tags:
    - docker


  before_script:

    # Alpine 安装 git，VitePress 构建需要
    - apk add --no-cache git

    # 开启 pnpm
    - corepack enable


  script:

    # 环境检查
    - node --version
    - npm --version
    - pnpm --version


    # 安装 monorepo 依赖
    - pnpm install --frozen-lockfile


    # 构建 VitePress
    - pnpm docs:build