# 工作流在 GitHub Actions 页面显示的名称
name: Release validation and deployment

# 只有推送 v 开头的 Git Tag 时触发
on:
  push:
    tags:
      - 'v*'

# 为工作流声明默认的 GITHUB_TOKEN 权限
permissions:
  # 允许读取仓库代码
  contents: read

# 控制同一时间只保留一个 Tag 流程
concurrency:
  # 使用固定的发布并发组名称
  group: release
  # 新的 Tag 流程开始时取消旧流程
  cancel-in-progress: true

# 定义工作流中的任务集合
jobs:
  # 验证 Tag 对应的代码和版本
  validate:
    # 使用 GitHub 提供的 Ubuntu 云端 Runner
    runs-on: ubuntu-latest

    # 定义验证任务要按顺序执行的步骤
    steps:
      # 将 Tag 对应的仓库代码下载到 Runner
      - name: Checkout
        # 使用官方 Checkout Action
        uses: actions/checkout@v5

      # 安装 pnpm 包管理器
      - name: Setup pnpm
        # 使用 pnpm 官方 Action
        uses: pnpm/action-setup@v4
        # 配置 pnpm 版本
        with:
          # 使用项目 package.json 中指定的 pnpm 版本
          version: 11.24.0

      # 安装 Node.js 运行环境
      - name: Setup Node.js
        # 使用 GitHub 官方 Node.js 配置 Action
        uses: actions/setup-node@v5
        # 配置 Node.js 版本、缓存和 npm registry
        with:
          # 指定 Node.js 主版本
          node-version: 24
          # 启用 pnpm 依赖缓存
          cache: pnpm
          # 为将来发布 npm 包准备官方 registry 配置
          registry-url: https://registry.npmjs.org

      # 安装项目依赖
      - name: Install dependencies
        # frozen-lockfile 要求锁文件与 package.json 保持一致
        run: pnpm install --frozen-lockfile

      # 检查 TypeScript 语法和类型
      - name: Type check
        # 不生成文件，只执行类型检查
        run: pnpm typecheck

      # 执行单元测试
      - name: Run tests
        # 调用根 package.json 中的 test 脚本
        run: pnpm test

      # 构建 npm 包
      - name: Build package
        # 调用根 package.json 中的 build 脚本
        run: pnpm build

      # 构建 VitePress 文档网站
      - name: Build documentation
        # 输出目录为 docs/.vitepress/dist
        run: pnpm docs:build
        # 为 VitePress 提供 GitHub Pages 的项目路径
        env:
          # 当前仓库名会对应 GitHub Pages 的项目子路径
          CI_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # 保存文档构建结果，供正式 Tag 的部署任务使用
      - name: Upload documentation artifact
        # 使用 GitHub 官方通用产物上传 Action
        uses: actions/upload-artifact@v4
        # 配置产物名称和目录
        with:
          # 产物名称，部署任务会按此名称下载
          name: release-docs
          # VitePress 生成的静态网站目录
          path: docs/.vitepress/dist

      # 检查 Tag 格式和正式版本号
      - name: Verify tag version
        # 使用 Bash 执行版本检查
        shell: bash
        run: |
          # 去掉 Tag 前面的 v，得到纯版本号
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # 读取 npm 包的版本号
          PACKAGE_VERSION="$(node -p "require('./packages/utils/package.json').version")"

          # 允许 1.2.3 和 1.2.3-alpha.1 形式的语义化版本
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $GITHUB_REF_NAME"
            exit 1
          fi

          # alpha、beta 等预发布 Tag 只做验证，不部署和发布
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "Pre-release tag detected: $GITHUB_REF_NAME"
            echo "Pages deployment and npm publication are disabled for pre-release tags."
            exit 0
          fi

          # 正式 Tag 必须与 package.json 的版本完全一致
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

          echo "Release tag $GITHUB_REF_NAME matches package version $PACKAGE_VERSION"

      # npm 发布步骤暂时禁用，准备正式发版时再取消下面的注释
      # - name: Publish package to npm
      #   env:
      #     # 在 GitHub Settings -> Secrets and variables -> Actions 中配置
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: pnpm publish:utils --no-git-checks

  # 只负责将正式版本的文档发布到 GitHub Pages
  deploy-pages:
    # 验证任务成功后才允许部署
    needs: validate
    # 带连字符的预发布 Tag 不部署，只有正式版本 Tag 部署
    if: needs.validate.result == 'success' && !contains(github.ref_name, '-')
    # 使用 GitHub 提供的 Ubuntu 云端 Runner
    runs-on: ubuntu-latest

    # 为 Pages 部署任务声明所需权限
    permissions:
      # 允许读取仓库元数据和工作流产物
      contents: read
      # 允许上传和发布 GitHub Pages
      pages: write
      # 允许 Pages 使用 OIDC 身份令牌完成部署
      id-token: write

    # 只有正式版本 Tag 申请 github-pages 环境
    environment:
      # 环境名称，部署保护规则只作用于正式部署
      name: github-pages
      # 部署成功后在环境页面显示实际站点地址
      url: ${{ steps.deployment.outputs.page_url }}

    # 定义部署任务要按顺序执行的步骤
    steps:
      # 下载验证任务生成的文档产物
      - name: Download documentation artifact
        # 使用 GitHub 官方通用产物下载 Action
        uses: actions/download-artifact@v4
        # 配置下载的产物名称和目标目录
        with:
          # 必须与验证任务上传的名称一致
          name: release-docs
          # 下载到当前 Runner 的 docs-dist 目录
          path: docs-dist

      # 初始化或检查 GitHub Pages 配置
      - name: Configure GitHub Pages
        # 使用 GitHub 官方 Pages 配置 Action
        uses: actions/configure-pages@v5
        # 配置 Action 的参数
        with:
          # 如果仓库尚未启用 Pages，则尝试自动启用
          enablement: true

      # 把构建后的文档目录上传为 Pages 专用产物
      - name: Upload Pages artifact
        # 使用 GitHub Pages 官方产物上传 Action
        uses: actions/upload-pages-artifact@v3
        # 配置需要上传的目录
        with:
          # 下载后的 VitePress 静态网站目录
          path: docs-dist

      # 将 Pages 产物发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        # 给这一步命名，供 environment.url 引用部署地址
        id: deployment
        # 使用 GitHub 官方 Pages 部署 Action
        uses: actions/deploy-pages@v4
