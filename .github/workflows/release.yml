# 工作流在 GitHub Actions 页面显示的名称
name: Release validation

# 只有推送 v 开头的 Git Tag 时触发
on:
  push:
    tags:
      - 'v*'

# 为工作流声明默认的 GITHUB_TOKEN 权限
permissions:
  # 允许读取仓库代码
  contents: read

# 定义工作流中的任务集合
jobs:
  # 验证 Tag 对应的代码和版本
  validate:
    # 使用 GitHub 提供的 Ubuntu 云端 Runner
    runs-on: ubuntu-latest

    # 定义验证任务要按顺序执行的步骤
    steps:
      # 将 Tag 对应的仓库代码下载到 Runner
      - name: Checkout
        # 使用官方 Checkout Action
        uses: actions/checkout@v5

      # 安装 pnpm 包管理器
      - name: Setup pnpm
        # 使用 pnpm 官方 Action
        uses: pnpm/action-setup@v4
        # 配置 pnpm 版本
        with:
          # 使用项目 package.json 中指定的 pnpm 版本
          version: 11.24.0

      # 安装 Node.js 运行环境
      - name: Setup Node.js
        # 使用 GitHub 官方 Node.js 配置 Action
        uses: actions/setup-node@v5
        # 配置 Node.js 版本和 pnpm 缓存
        with:
          # 指定 Node.js 主版本
          node-version: 24
          # 启用 pnpm 依赖缓存
          cache: pnpm
          # 为将来发布 npm 包准备官方 registry 配置
          registry-url: https://registry.npmjs.org

      # 安装项目依赖
      - name: Install dependencies
        # frozen-lockfile 要求锁文件与 package.json 保持一致
        run: pnpm install --frozen-lockfile

      # 检查 TypeScript 语法和类型
      - name: Type check
        # 不生成文件，只执行类型检查
        run: pnpm typecheck

      # 执行单元测试
      - name: Run tests
        # 调用根 package.json 中的 test 脚本
        run: pnpm test

      # 构建 npm 包
      - name: Build package
        # 调用根 package.json 中的 build 脚本
        run: pnpm build

      # 检查 Tag 是否符合版本规则，并验证正式版本号
      - name: Verify tag version
        # 使用 Bash 执行版本检查
        shell: bash
        run: |
          # 去掉 Tag 前面的 v，得到纯版本号
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # 读取 npm 包的版本号
          PACKAGE_VERSION="$(node -p "require('./packages/utils/package.json').version")"

          # 允许 1.2.3 和 1.2.3-alpha.1 形式的语义化版本
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $GITHUB_REF_NAME"
            exit 1
          fi

          # 预发布 Tag 只做验证，不要求修改 npm 版本
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "Pre-release tag detected: $GITHUB_REF_NAME"
            echo "npm publication is disabled for pre-release tags."
            exit 0
          fi

          # 正式 Tag 必须与 package.json 的版本完全一致
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

          echo "Release tag $GITHUB_REF_NAME matches package version $PACKAGE_VERSION"

      # npm 发布步骤暂时禁用，准备正式发版时再取消下面的注释
      # - name: Publish package to npm
      #   env:
      #     # 在 GitHub Settings -> Secrets and variables -> Actions 中配置
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: pnpm publish:utils --no-git-checks
