# 工作流在 GitHub Actions 页面显示的名称
name: CI

# 定义什么时候触发这个工作流
on:
  # 分支推送时触发，Tag 由 release.yml 负责
  push:
    # 匹配所有分支，不匹配 Tag
    branches:
      - '**'
  # 创建或更新指向 main 的 Pull Request 时触发
  pull_request:
    # 只监听目标为 main 的 Pull Request
    branches:
      - main
  # 允许在 Actions 页面手动运行
  workflow_dispatch:

# 为工作流声明默认的 GITHUB_TOKEN 权限
permissions:
  # 允许读取仓库代码
  contents: read

# 定义工作流中的任务集合
jobs:
  # 验证代码、构建包和生成文档
  verify:
    # 使用 GitHub 提供的 Ubuntu 云端 Runner
    runs-on: ubuntu-latest

    # 定义验证任务要按顺序执行的步骤
    steps:
      # 将当前仓库代码下载到 Runner
      - name: Checkout
        # 使用官方 Checkout Action
        uses: actions/checkout@v5

      # 安装 pnpm 包管理器
      - name: Setup pnpm
        # 使用 pnpm 官方 Action
        uses: pnpm/action-setup@v4
        # 配置 pnpm 版本
        with:
          # 使用项目 package.json 中指定的 pnpm 版本
          version: 11.24.0

      # 安装 Node.js 运行环境
      - name: Setup Node.js
        # 使用 GitHub 官方 Node.js 配置 Action
        uses: actions/setup-node@v5
        # 配置 Node.js 版本和 pnpm 缓存
        with:
          # 指定 Node.js 主版本
          node-version: 24
          # 启用 pnpm 依赖缓存
          cache: pnpm

      # 安装项目依赖
      - name: Install dependencies
        # frozen-lockfile 要求锁文件与 package.json 保持一致
        run: pnpm install --frozen-lockfile

      # 检查 TypeScript 语法和类型
      - name: Type check
        # 不生成文件，只执行类型检查
        run: pnpm typecheck

      # 执行单元测试
      - name: Run tests
        # 调用根 package.json 中的 test 脚本
        run: pnpm test

      # 构建工具库发布产物
      - name: Build package
        # 调用根 package.json 中的 build 脚本
        run: pnpm build

      # 构建 VitePress 文档网站
      - name: Build documentation
        # 输出目录为 docs/.vitepress/dist
        run: pnpm docs:build
        # 为 VitePress 提供 GitHub Pages 的项目路径
        env:
          # 当前仓库名会对应 GitHub Pages 的项目子路径
          CI_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # 保存文档构建结果供检查使用
      - name: Upload documentation artifact
        # 使用 GitHub 官方通用产物上传 Action
        uses: actions/upload-artifact@v4
        # 配置产物名称和目录
        with:
          # 产物名称
          name: vitepress-docs
          # VitePress 生成的静态网站目录
          path: docs/.vitepress/dist
